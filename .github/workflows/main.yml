name: Build My Angular App

on:
  push:
     branches: [ main ]

jobs:
  build-angular-app:
    runs-on: ubuntu-latest

    steps:
       - uses: actions/checkout@v2.8.0
       - name: setup Node JS
         uses: actions/setup-node@v7.1.0
         with:
           node-version: 22.*
       - name: install Dependencies
         run: npm install
       - name: Build Angular App
         run: npm run build
